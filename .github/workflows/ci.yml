name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-gate:
    name: Code Format Gate (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install clang-format-21 from LLVM apt repository
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/llvm-21.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends clang-format-21

      - name: Run code formatting check
        run: ./scripts/dev.sh format --check

  tidy-gate:
    name: Incremental Static Analysis (clang-tidy)
    runs-on: ubuntu-24.04
    env:
      TIDY_CACHE_DIR: ${{ github.workspace }}/.cache/tidy-cache
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies & clang-tidy-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/llvm-21.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-21 ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev
      - name: Restore/Save clang-tidy result cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/tidy-cache
          key: linux-tidy-cache-${{ hashFiles('.clang-tidy', 'CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-${{ github.sha }}
          restore-keys: |
            linux-tidy-cache-${{ hashFiles('.clang-tidy', 'CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-
            linux-tidy-cache-

      - name: Configure CMake for compile_commands.json
        run: ./scripts/dev.sh wsl-build --configure-only

      - name: Run incremental clang-tidy on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E '^source/.*\.(cpp|h)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^source/.*\.(cpp|h)$' || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "[CI] No source C++ files modified in this commit range. Skipping static analysis."
            exit 0
          fi

          echo "[CI] Running incremental clang-tidy on:"
          echo "$CHANGED_FILES"
          ./scripts/dev.sh tidy $CHANGED_FILES

  linux-gate:
    name: Linux Build, Unit Tests & Release Gate
    # Debug 测试与 Release 构建合并为单 job：共享一个 runner 与一份 ccache
    # 缓存（ccache 内容寻址，Debug/Release 条目按编译选项自动区分），避免
    # 双 runner 重复全量编译。固定 ubuntu-24.04：glibc 门槛检查以 24.04
    # （glibc 2.39）为基准，与 release.yml 的 release-linux-x64 同环境，
    # 防 runner 镜像漂移。
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "1G"
      CCACHE_BASEDIR: "${{ github.workspace }}"
      # ccache 4.x 对使用 PCH（-include-pch）的编译默认判 uncacheable（本地实测：
      # pch_defines 不够，time_macros 是进入缓存的必要条件，命中正常）。项目不消费
      # __TIME__/__DATE__（JUCE 内部编译日期字符串无人读取），无副作用。
      CCACHE_SLOPPINESS: "time_macros"
      CMAKE_C_COMPILER_LAUNCHER: "ccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
    steps:
      - name: Checkout repository with submodules (shallow)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies & ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld mold pkg-config ccache binutils \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Restore/Save ccache compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-
            linux-ccache-

      - name: Build (Debug) & run unit tests
        run: |
          ccache -z
          ./scripts/dev.sh test
          ccache -s

      # Release 配置同样构建并运行单元测试（业界标准：测试须覆盖用户实际
      # 运行的优化配置——-O3/-flto 可暴露 Debug 掩盖的 UB、strict aliasing
      # 与未初始化变量问题，Surge/ChowDSP 均在 Release 上跑测试）。
      - name: Configure CMake (linux-clang-release, tests)
        run: cmake --preset linux-clang-release -DBUILD_TESTS=ON

      - name: Build target binary & tests (Release)
        run: cmake --build --preset linux-clang-release --target devpiano devpiano_tests

      - name: Run unit tests (Release)
        run: ctest --test-dir build-wsl-clang-release --output-on-failure

      - name: Check glibc/libstdc++ version floor
        run: |
          ./scripts/check_linux_glibc_floor.sh \
            build-wsl-clang-release/devpiano_artefacts/Release/DevPiano

      - name: Show ccache statistics
        run: ccache -s

  windows-msvc-gate:
    name: Windows MSVC Build & Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules (shallow)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Restore/Save sccache compiler cache
        uses: actions/cache@v6
        with:
          path: C:/Users/runneradmin/.cache/sccache
          key: windows-sccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-${{ github.sha }}
          restore-keys: |
            windows-sccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-
            windows-sccache-

      - name: Install sccache binary on Windows
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "[CI] Installing sccache..."
            curl -sSL https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-pc-windows-msvc.tar.gz | tar -xz -C "C:/Program Files/Git/usr/bin" --strip-components=1
          fi
          sccache --version

      # sccache 不支持 MSVC PCH（/Yc /Yu，官方已知限制）：使用 PCH 的编译单元全部
      # non-cacheable，缓存形同虚设（实测缓存仅 9 MiB、395/441 调用未缓存、每次
      # push 全量重编）。CI 禁用 PCH 后 sccache 可命中全部对象；本地/镜像开发构建
      # 不受影响（保留 PCH，ninja 增量构建仍快）。
      - name: Configure CMake with sccache (windows-msvc-debug)
        env:
          SCCACHE_DIR: C:/Users/runneradmin/.cache/sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: cmake --preset windows-msvc-debug -DBUILD_TESTS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Build target binaries (Debug)
        run: cmake --build --preset windows-msvc-debug

      - name: Run Windows unit test suite
        run: ctest --test-dir build-win-msvc --output-on-failure

      # Windows Release 构建验证：push 门禁必须覆盖发布配置——否则 MSVC
      # Release 编译错误（/O2 相关、NDEBUG 分支）要到 tag 发布时才暴露。
      # 同上：Release 配置同样禁用 PCH 以启用 sccache 缓存
      - name: Configure CMake with sccache (windows-msvc-release)
        env:
          SCCACHE_DIR: C:/Users/runneradmin/.cache/sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: cmake --preset windows-msvc-release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Build target binary (Release)
        env:
          SCCACHE_DIR: C:/Users/runneradmin/.cache/sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: cmake --build --preset windows-msvc-release --target devpiano

      - name: Show sccache statistics
        shell: bash
        run: sccache --show-stats || true
