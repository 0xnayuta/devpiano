name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]


# 并发控制：同一 PR 连续 push 时自动终止正在运行的旧任务，避免重复消耗 API 额度与评论冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run PR Agent (auto review + describe, on-demand improve)
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@v0.41.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI.KEY: ${{ secrets.API_KEY }}
          OPENAI.API_BASE: "https://api.pie-xian.com/v1"
          # 模型与运行参数：Gemini 3.7 Flash（通过 OpenAI 兼容中转站，fallback 指向同模型）
          config.model: "openai/gemini-3.7-flash"
          config.fallback_models: '["openai/gemini-3.7-flash"]'
          config.temperature: "0.3"
          # 上下文窗口限制：显式声明自定义模型上限，扩大 token 预算避免大 PR 截断 diff
          config.custom_model_max_tokens: "1024000"
          config.max_model_tokens: "256000"
          pr_reviewer.max_model_tokens: "256000"
          pr_description.max_model_tokens: "256000"
          # 评论体验优化：原地更新 Review，精简辅助与更新通知
          pr_reviewer.persistent_comment: "true"
          pr_description.final_update_message: "false"
          config.enable_help_text: "false"
          # 自动工具开关（improve 逐行建议噪音大，推荐按需手动 /improve）
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          # synchronize: push 新提交后自动做增量 review
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
