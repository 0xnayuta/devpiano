name: Release Delivery

'on':
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows-x64:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository with submodules (shallow)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore/Save sccache compiler cache
        uses: actions/cache@v6
        with:
          path: C:/Users/runneradmin/.cache/sccache
          key: release-sccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-${{ github.sha }}
          restore-keys: |
            release-sccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-
            release-sccache-

      - name: Install sccache binary on Windows
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "[Release] Installing sccache..."
            curl -sSL https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-pc-windows-msvc.tar.gz | tar -xz -C "C:/Program Files/Git/usr/bin" --strip-components=1
          fi
          sccache --version

      - name: Configure CMake (windows-msvc-release)
        env:
          SCCACHE_DIR: C:/Users/runneradmin/.cache/sccache
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: cmake --preset windows-msvc-release

      - name: Build target binary (Release)
        run: cmake --build --preset windows-msvc-release --target devpiano

      - name: Package Release ZIP and SHA256
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          DIST_DIR="dist/${TAG_NAME}"
          ZIP_NAME="DevPiano-${TAG_NAME}-win-x64.zip"
          SHA_NAME="DevPiano-${TAG_NAME}-win-x64.sha256"

          echo "[Release] Preparing distribution directory: ${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          EXE_PATH="build-win-msvc-release/devpiano_artefacts/Release/DevPiano.exe"
          if [[ ! -f "${EXE_PATH}" ]]; then
            echo "Error: Executable not found at ${EXE_PATH}" >&2
            exit 1
          fi

          cp "${EXE_PATH}" "${DIST_DIR}/"
          cp CHANGELOG.md "${DIST_DIR}/"

          cd "${DIST_DIR}"
          echo "[Release] Creating ZIP package: ${ZIP_NAME}"
          7z a -tzip -mx=9 "${ZIP_NAME}" DevPiano.exe CHANGELOG.md

          echo "[Release] Calculating SHA256 checksum: ${SHA_NAME}"
          sha256sum "${ZIP_NAME}" > "${SHA_NAME}"

          echo "[Release] Package contents:"
          ls -lh

          echo "[Release] SHA256 checksum value:"
          cat "${SHA_NAME}"

      - name: Show sccache statistics
        shell: bash
        run: sccache --show-stats || true

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v3
        with:
          name: "DevPiano ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          files: |
            dist/${{ github.ref_name }}/DevPiano-${{ github.ref_name }}-win-x64.zip
            dist/${{ github.ref_name }}/DevPiano-${{ github.ref_name }}-win-x64.sha256

  release-linux-x64:
    name: Build & Package Linux x64 Release
    runs-on: ubuntu-24.04
    needs: release-windows-x64
    steps:
      - name: Checkout repository with submodules (shallow)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies & ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld pkg-config ccache binutils mold \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      # ccache 遵循 ADR-011 编译器缓存规范：tag 触发的低频发布 job 复用
      # 历史发布缓存，全量 Release（含 LTO）构建时间从分钟级降至秒级。
      - name: Restore/Save ccache compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: linux-release-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-${{ github.ref_name }}
          restore-keys: |
            linux-release-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'submodules/**') }}-
            linux-release-ccache-

      - name: Configure CMake (linux-clang-release)
        env:
          CCACHE_COMPRESS: "true"
          CCACHE_COMPRESSLEVEL: "6"
          CCACHE_MAXSIZE: "1G"
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
        run: cmake --preset linux-clang-release

      - name: Build target binary (Release)
        env:
          CCACHE_COMPRESS: "true"
          CCACHE_COMPRESSLEVEL: "6"
          CCACHE_MAXSIZE: "1G"
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
        run: cmake --build --preset linux-clang-release --target devpiano

      # glibc / libstdc++ 版本门槛（Phase 25-C）：产物必须满足支持矩阵
      # （glibc >= 2.39，Ubuntu 24.04+ / Debian 13+ / Fedora 41+ / Arch 系）。
      # ubuntu-24.04 runner 构建的门槛为 GLIBC_2.39 / GLIBCXX_3.4.32；
      # 若未来 runner 镜像漂移导致门槛上升，此检查会拦截发布。
      - name: Check glibc/libstdc++ version floor
        run: |
          ./scripts/check_linux_glibc_floor.sh \
            build-wsl-clang-release/devpiano_artefacts/Release/DevPiano

      - name: Package Release tar.gz and SHA256
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          DIST_DIR="dist/${TAG_NAME}"
          TAR_NAME="DevPiano-${TAG_NAME}-linux-x64.tar.gz"
          SHA_NAME="DevPiano-${TAG_NAME}-linux-x64.sha256"

          echo "[Release] Preparing distribution directory: ${DIST_DIR}"
          mkdir -p "${DIST_DIR}"

          BIN_PATH="build-wsl-clang-release/devpiano_artefacts/Release/DevPiano"
          if [[ ! -f "${BIN_PATH}" ]]; then
            echo "Error: Executable not found at ${BIN_PATH}" >&2
            exit 1
          fi

          cp "${BIN_PATH}" "${DIST_DIR}/"
          cp CHANGELOG.md "${DIST_DIR}/"

          cd "${DIST_DIR}"
          echo "[Release] Creating tar.gz package: ${TAR_NAME}"
          tar -czf "${TAR_NAME}" DevPiano CHANGELOG.md

          echo "[Release] Calculating SHA256 checksum: ${SHA_NAME}"
          sha256sum "${TAR_NAME}" > "${SHA_NAME}"

          echo "[Release] Package contents:"
          ls -lh

          echo "[Release] SHA256 checksum value:"
          cat "${SHA_NAME}"

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v3
        with:
          name: "DevPiano ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          files: |
            dist/${{ github.ref_name }}/DevPiano-${{ github.ref_name }}-linux-x64.tar.gz
            dist/${{ github.ref_name }}/DevPiano-${{ github.ref_name }}-linux-x64.sha256
